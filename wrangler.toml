name = "resale-scanner"
main = "worker.js"
compatibility_date = "2026-09-27"

[assets]
directory = "./public"
binding = "ASSETS"

[triggers]
crons = ["0 12 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "resale-scanner-monitoring"
database_id = "ad952bf0-76be-443f-b9bf-f23371040314"
migrations_dir = "migrations"

[vars]
EBAY_SOLD_API_URL = "https://api.ebaysoldlistingsapi.com/scrape"
EBAY_PROVIDER_DAILY_REQUEST_LIMIT = "200"
EBAY_PROVIDER_MINUTE_REQUEST_LIMIT = "20"
SCAN_ZIP_CODE = "60409"
SCAN_RADIUS_MILES = "15"
